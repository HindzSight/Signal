name: Release desktop builds

# Push a version tag (e.g. `git tag v0.2.0 && git push origin v0.2.0`) to build
# the Mac, Windows, and Linux installers and publish them to a GitHub Release.
#
# electron-builder's own "--publish" flow is NOT used here: when no release
# exists yet for a tag, it creates one - and if two platform jobs both hit
# that at once (or even one after another, in practice), each can end up
# creating its own separate draft release with the same tag name, since
# GitHub allows multiple drafts to share a tag until one is actually
# published. That produced two split releases the first time this ran.
#
# Instead: one job creates the (draft) release exactly once, both platform
# jobs build and upload their own installers to that specific release via
# `gh release upload`, and a final job only flips it to public once both
# uploads have succeeded - so nothing incomplete is ever visible publicly.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # No checkout in this job, so gh has no local git context to infer the
        # repo from - --repo must stay explicit here (unlike the jobs below,
        # which do check the repo out).
        run: |
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft --title "${{ github.ref_name }}" --generate-notes

  mac:
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - run: node scripts/fetch-cloudflared.mjs darwin-x64 darwin-arm64
      # electron-builder auto-detects CI and otherwise tries to publish itself
      # (and fails without a token, since gh release upload handles that here
      # instead) - --publish never turns that implicit behavior off.
      - run: npx electron-builder --mac --publish never
      - name: Upload installers to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" --clobber release/*.dmg release/*.zip

  windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - run: node scripts/fetch-cloudflared.mjs win32-x64
      - run: npx electron-builder --win --publish never
      - name: Upload installer to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # windows-latest's default shell doesn't glob-expand args to external
        # commands the way bash does, so resolve the file path explicitly.
        run: |
          $installer = Get-ChildItem -Path release -Filter "Signal Setup*.exe" | Select-Object -First 1 -ExpandProperty FullName
          gh release upload "${{ github.ref_name }}" --clobber $installer

  linux:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - run: node scripts/fetch-cloudflared.mjs linux-x64
      - run: npx electron-builder --linux --publish never
      - name: Upload installer to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" --clobber release/*.AppImage

  publish-release:
    needs: [mac, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release now that both installers are attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # No checkout in this job either - see the note on create-release.
        run: gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false
